<head>
  <meta charset="utf-8">

  <meta name="apple-mobile-web-app-title" content="Galería">
  <title>Sean and Valeria · Gallery</title>
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/gpt/favicon-social-preview-rounded.png?v=20260830b">
  <link rel="apple-touch-icon" href="../assets/gpt/favicon-social-preview-rounded.png?v=20260830b">
  <!-- Same cosmetic gate as the site: no invitation password, no gallery. The API checks the
       password itself; this only keeps the page from showing to someone who hasn't entered it. -->
  <script>try{if(localStorage.getItem('wedding-access-v1')!=='true')location.replace('../')}catch(e){location.replace('../')}</script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="photos">
<div class="sp-card">
<header class="top">
  <a class="back" href="../" data-t="back">← seanandvaleria.com</a>
  <button class="admin-pill" id="admin-pill" type="button" hidden>Admin</button>
  <div class="lockup">
    <img src="../assets/gpt/sv-logo-variants/solid/sv-logo-mocha-true-solid.png" alt="Sean &amp; Valeria" width="1536" height="1024">
    <div class="date">3<span class="sep">·</span>11<span class="sep">·</span>2026</div>
  </div>
  <p class="eyebrow" data-t="eyebrow">Gallery</p>
  <h1 class="title" id="title">Our wedding, <em>through your eyes</em></h1>
  <p class="lede" id="lede" data-t="lede">Share your photos from the trip and the day. Tag who's in them, and find every photo of you.</p>
  <div class="actions" id="actions">
    <button class="btn solid" id="upload-btn" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 15v3.2c0 1 .8 1.8 1.8 1.8h10.4c1 0 1.8-.8 1.8-1.8V15"/></svg><span data-t="add">Add photos</span></button>
    <button class="btn ghost" id="me-btn" type="button"></button>
  </div>
  <div class="card" id="closed-card" hidden>
    <img src="../assets/gpt/wax-seal-sv-exact-transparent-v3.webp" alt="" width="1271" height="1237">
    <p><span class="card-kicker" id="closed-kicker"></span><span id="closed-text"></span><small id="closed-sub"></small></p>
  </div>
  <input type="file" id="file" accept="image/*" multiple hidden>
</header>

<div class="bars" id="bars">
  <nav class="filters" id="filters" aria-label="Filters"></nav>
  <nav class="rail" id="rail" aria-label="Timeline"></nav>
</div>

<main class="grid-wrap" id="grid" aria-live="polite"></main>
<div class="empty" id="empty" hidden></div>
</div>
<button class="new-pill" id="new-pill" type="button" hidden></button>

<!-- one photo -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
  <div class="lb-stage" id="lb-stage">
    <img id="lb-img" alt="">
    <span class="lb-count" id="lb-count"></span>
    <button class="lb-nav prev" id="lb-prev" type="button" aria-label="Previous">‹</button>
    <button class="lb-nav next" id="lb-next" type="button" aria-label="Next">›</button>
    <button class="lb-close" id="lb-close" type="button" aria-label="Close">×</button>
  </div>
  <aside class="lb-info" id="lb-info"></aside>
</div>

<!-- pickers and prompts -->
<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<!-- drop photos onto the page (computers) -->
<div class="drop" id="drop" hidden><div><small data-t="add">Add photos</small><span data-t="dropHere">Drop your photos here</span></div></div>

<!-- upload progress -->
<section class="tray" id="tray" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/exifr-7.1.3-lite.umd.js"></script>
<script src="../assets/gpt/subpage.js?v=20261014b"></script>
<script src="gallery.js?v=20261014d"></script>
</body>
</html>
